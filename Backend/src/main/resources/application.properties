spring.application.name=backend
server.port=${PORT:8080}


# PostgreSQL Configuration
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_DB_USERNAME}
spring.datasource.password=${POSTGRES_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Fix for "prepared statement already exists" error
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_AUTH_KEY}
 


#todo : --------- Local Configuration(For File Storage) -----
storage.local.input-dir=storage/input
storage.local.output-dir=storage/output


#todo : ---- REDIS Related Variables -------
spring.redis.host=localhost
spring.redis.port=6379




#todo : Hikari make the DB connection request faster
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000